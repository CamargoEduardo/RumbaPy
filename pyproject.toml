[project]
name = "rumbapy"
version = "2.0.0"            # tem que bater com src/rumbapy/_version.py (o backend confere)
description = "Automação de terminais RUMBA via Python e EHLAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/CamargoEduardo/RumbaPy"

# Backend PEP 517 próprio, só stdlib (H.7): pip instala por archive/<sha>.zip ou git+https sem baixar nada do PyPI.
[build-system]
requires = []
build-backend = "rumbapy_build"
backend-path = ["_build"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
timeout = 30
markers = [
    "live: testes ao vivo contra o RUMBA real (manuais; exigem RUMBAPY_LIVE=1 e guard, J.6)",
    "e2e: ponta a ponta com o worker real em subprocesso e --fake-dll (J.4)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "_build"]
extend-exclude = ["tools/research", "docs"]

[tool.ruff.lint]
# Seleção usada no projeto (CLAUDE.md): erros, pyflakes e avisos. A ordem dos imports (comprimento decrescente) não
# é expressável no isort do ruff: arquivos novos usam "# ruff: noqa: I001" (A.8 l).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# TODO(P-E): código legado da v0.1.5, substituído por stubs na Onda 2 (B.9.3/B.9.4); some junto com ele.
"src/rumbapy/api.py" = ["E701", "E722"]
"src/rumbapy/client.py" = ["E722"]
"src/rumbapy/server.py" = ["E722", "W291", "W292"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
include = ["src", "_build"]
# TODO(P-G): remover a exclusão quando o P-E substituir os módulos legados da v0.1.5 (pywin32/pywinauto).
exclude = ["src/rumbapy/api.py", "src/rumbapy/server.py", "**/__pycache__"]
typeCheckingMode = "basic"
