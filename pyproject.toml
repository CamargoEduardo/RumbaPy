[project]
name = "rumbapy"
version = "0.1.3"
description = "Automação de terminais RUMBA via Python e EHLAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server32 = [
    "pywin32", "pywinauto"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"