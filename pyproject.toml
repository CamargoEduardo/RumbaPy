[project]
name = "rumbapy"
version = "0.1.5"
description = "Automação de terminais RUMBA via Python e EHLAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server32 = [
    "pywin32", "pywinauto"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
timeout = 30
markers = [
    "live: testes ao vivo contra o RUMBA real (manuais; exigem RUMBAPY_LIVE=1 e guard, J.6)",
    "e2e: ponta a ponta com o worker real em subprocesso e --fake-dll (J.4)",
]
